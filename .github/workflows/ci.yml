name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: this workflow only needs to read the repo and run tests.
permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      # Pinned to commit SHAs for supply-chain security (audit before bumping).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q spa.py scheduler.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Scheduler selftest
        run: python scheduler.py selftest
      - name: Scheduler offline simulation
        run: python scheduler.py plan --simulate > /tmp/plan.txt && test -s /tmp/plan.txt
